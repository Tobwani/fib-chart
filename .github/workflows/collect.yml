name: Hintergrund-Daten sammeln
# Sammelt Wal-Trades und wichtige Termine, auch wenn die App zu ist.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/scripts/collect.mjs', '.github/workflows/collect.yml']
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Letzten Stand holen
        run: |
          mkdir -p out
          if git fetch --depth=1 origin data 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C out || true
          fi
          ls -la out
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sammeln
        run: node .github/scripts/collect.mjs out
      - name: In Branch "data" speichern
        run: |
          cd out
          git init -q -b data
          git config user.name "fib-chart-bot"
          git config user.email "fib-chart-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Daten $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
